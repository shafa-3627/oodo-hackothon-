<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="purpleGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="blueGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
  </defs>
  <!-- Background glow -->
  <circle cx="50" cy="50" r="45" fill="none" stroke="url(#purpleGradient)" stroke-width="2" stroke-opacity="0.3" />
  
  <!-- Human Shape 1 -->
  <circle cx="35" cy="40" r="10" fill="url(#purpleGradient)" />
  <path d="M15 75 C15 55, 55 55, 55 75 Z" fill="url(#purpleGradient)" opacity="0.85" />
  
  <!-- Human Shape 2 -->
  <circle cx="65" cy="40" r="10" fill="url(#blueGradient)" />
  <path d="M45 75 C45 55, 85 55, 85 75 Z" fill="url(#blueGradient)" opacity="0.85" />

  <!-- Core Connect/Globe Ring -->
  <ellipse cx="50" cy="62" rx="35" ry="12" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-dasharray="10, 15" opacity="0.7"/>
</svg>
